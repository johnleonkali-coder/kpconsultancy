<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KP Consultantsy — Career &amp; Job Feed</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a href="index.html" class="brand">
        <div class="brand-badge">KP</div>
        <span class="brand-text">KP Consultantsy</span>
      </a>
      <nav class="nav-actions">
        <a href="login.html" class="btn btn-outline btn-sm">Admin Login</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <section class="feed-hero">
      <h1>Latest Career Opportunities</h1>
      <p>Browse verified job openings from KP Consultantsy. Like, comment, or apply directly — no account needed.</p>
    </section>

    <section class="search-card" aria-label="Search job postings">
      <form id="searchForm" class="search-row">
        <input
          type="search"
          id="searchInput"
          class="search-input"
          placeholder="Search by job title, keywords, company, or #hashtag (e.g. #RemoteJobs)..."
          aria-label="Search jobs"
        />
        <button type="submit" class="btn btn-primary">Search</button>
        <button type="button" id="showAllBtn" class="btn btn-secondary">Show All</button>
      </form>
      <div id="searchStatus" class="search-status"></div>
    </section>

    <section id="feedContainer" aria-live="polite">
      <div class="empty-state">Loading latest job openings...</div>
    </section>
  </main>

  <script src="config.js"></script>
  <script src="auth.js"></script>
  <script src="likes.js"></script>
  <script src="comments.js"></script>
  <script src="posts.js"></script>
  <script src="search.js"></script>
  <script>
    (function () {
      let cachedPosts = [];

      async function bootFeed() {
        const feedContainer = document.getElementById("feedContainer");
        const searchStatus = document.getElementById("searchStatus");
        const searchInput = document.getElementById("searchInput");

        try {
          cachedPosts = await window.KPPosts.fetchAllPublishedPosts();
          window.KPPosts.renderFeed(cachedPosts, feedContainer);
          searchStatus.textContent = `Showing all ${cachedPosts.length} job ${cachedPosts.length === 1 ? "post" : "posts"} (latest first).`;
        } catch (err) {
          feedContainer.innerHTML = `
            <div class="alert alert-error show">
              Unable to load job feed. Please verify your Supabase configuration in config.js. (${err.message})
            </div>
          `;
        }

        function runSearch() {
          const q = searchInput.value;
          const filtered = window.KPSearch.filterPosts(cachedPosts, q);
          window.KPPosts.renderFeed(filtered, feedContainer);
          if (q.trim()) {
            searchStatus.textContent = `Found ${filtered.length} matching ${filtered.length === 1 ? "post" : "posts"} for "${q.trim()}" (latest first).`;
          } else {
            searchStatus.textContent = `Showing all ${cachedPosts.length} job ${cachedPosts.length === 1 ? "post" : "posts"} (latest first).`;
          }
        }

        document.getElementById("searchForm").addEventListener("submit", function (e) {
          e.preventDefault();
          runSearch();
        });

        document.getElementById("showAllBtn").addEventListener("click", function () {
          searchInput.value = "";
          runSearch();
        });
      }

      document.addEventListener("DOMContentLoaded", bootFeed);
    })();
  </script>
</body>
</html>
